<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ケアマネっこ → ケアレンツ 変換アプリ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Meiryo', 'Hiragino Sans', sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    min-height: 100vh;
    padding: 24px;
    max-width: 680px;
    margin: 0 auto;
  }
  .badge { display: inline-block; background: #1e3a5f; color: #60a5fa; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; margin-bottom: 10px; letter-spacing: 0.08em; }
  h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
  .drop-zone { border: 2px dashed #2d3748; border-radius: 12px; padding: 40px 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: #161b27; margin-bottom: 16px; position: relative; }
  .drop-zone:hover, .drop-zone.over { border-color: #3b82f6; background: #1a2236; }
  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-icon { font-size: 36px; margin-bottom: 10px; }
  .drop-label { font-size: 14px; color: #9ca3af; line-height: 1.7; }
  .drop-label span { color: #60a5fa; font-weight: 700; }
  .file-card { background: #1a2236; border: 1px solid #2d3748; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .file-card .fname { font-family: monospace; font-size: 12px; color: #a5b4fc; flex: 1; word-break: break-all; }
  .file-card .rows { color: #6b7280; font-size: 12px; white-space: nowrap; }
  .info-box { border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; line-height: 1.8; }
  .info-box.green { background: #1a2f1a; border: 1px solid #2d5a2d; color: #86efac; }
  .info-box.green strong { color: #4ade80; }
  .info-box.blue { background: #1a2236; border: 1px solid #2d3f6b; color: #93c5fd; }
  .info-box.blue strong { color: #60a5fa; }
  .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s; font-family: inherit; }
  .btn-blue { background: #2563eb; color: #fff; }
  .btn-blue:hover:not(:disabled) { background: #1d4ed8; }
  .btn-blue:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-green { background: #16a34a; color: #fff; margin-top: 12px; }
  .btn-green:hover { background: #15803d; }
  .result { margin-top: 20px; background: #161b27; border: 1px solid #2d3748; border-radius: 10px; padding: 16px; }
  .result-title { font-size: 14px; font-weight: 700; color: #4ade80; margin-bottom: 14px; }
  .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid #1e293b; }
  .stat .lbl { color: #9ca3af; }
  .stat .val { font-family: monospace; font-weight: 700; }
  .stat .val.green { color: #4ade80; }
  .stat .val.blue { color: #60a5fa; }
  .log { margin-top: 14px; background: #0d1117; border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: 11px; color: #6b7280; max-height: 160px; overflow-y: auto; line-height: 1.9; }
  .log .ok1 { color: #4ade80; }
  .log .ok2 { color: #60a5fa; }
  .log .skip { color: #4b5563; }
</style>
</head>
<body>
<div class="badge">ケアマネっこ → ケアレンツ 変換</div>
<h1>ケアマネっこ → ケアレンツ 変換アプリ</h1>
<p class="sub">UPSIKYUファイルの福祉用具単位数を自動修正します</p>

<div class="drop-zone" id="dz">
  <input type="file" id="fi" accept=".csv,.CSV">
  <div class="drop-icon">📂</div>
  <div class="drop-label">UPSIKYUファイルをここにドロップ<br><span>または クリックして選択</span></div>
</div>

<div id="fc" style="display:none" class="file-card">
  <span>📄</span>
  <span class="fname" id="fn"></span>
  <span class="rows" id="fr"></span>
</div>

<div class="info-box blue">
  <strong>修正ルール：</strong><br>
  福祉用具行（171xxx）で列17に値がある場合、列13にコピー<br>
  出力：元ファイルと同じ名前・CP932（Shift-JIS）
</div>

<button class="btn btn-blue" id="cvt" disabled>変換実行</button>
<div id="res" style="display:none" class="result"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js"></script>
<script>
let rows = [];
let fname = '';

const dz = document.getElementById('dz');
const fi = document.getElementById('fi');
const fc = document.getElementById('fc');
const fn = document.getElementById('fn');
const fr = document.getElementById('fr');
const cvt = document.getElementById('cvt');
const res = document.getElementById('res');

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });
fi.addEventListener('change', e => { if(e.target.files[0]) load(e.target.files[0]); });

function load(file) {
  fname = file.name;
  const r = new FileReader();
  r.onload = e => {
    const uint8 = new Uint8Array(e.target.result);
    const uni = Encoding.convert(uint8, { to: 'UNICODE', from: 'SJIS', type: 'array' });
    const text = Encoding.codeToString(uni);
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    rows = lines.map(parseLine);
    fc.style.display = 'flex';
    fn.textContent = fname;
    fr.textContent = lines.length + '行 / ' + (file.size/1024).toFixed(1) + 'KB';
    cvt.disabled = false;
    res.style.display = 'none';
  };
  r.readAsArrayBuffer(file);
}

function parseLine(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { q = !q; cur += c; }
    else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function toCSVLine(row) {
  return row.map(cell => {
    if (cell.startsWith('"') && cell.endsWith('"')) return cell;
    if (cell.includes(',') || cell.includes('"') || cell.includes('\n')) return '"' + cell.replace(/"/g, '""') + '"';
    return cell;
  }).join(',');
}

cvt.addEventListener('click', () => {
  let cnt1 = 0, target = 0;
  const logs = [];

  const newRows = rows.map((row, i) => {
    const r = [...row];
    const svc = (row[8] || '').replace(/"/g,'').trim();
    if (/^171/.test(svc)) {
      target++;
      const v13 = parseInt((row[12] || '0').trim()) || 0;  // 列13 = index12
      const v17 = parseInt((row[16] || '0').trim()) || 0;  // 列17 = index16

      if (v17 > 0 && v13 === 0) {
        // 列17→列13へコピー
        r[12] = String(v17);
        cnt1++;
        logs.push('<span class="ok1">✓ 行' + (i+1) + ' [' + svc + '] 単位数 ' + v17 + ' → 列13へコピー</span>');
      } else {
        logs.push('<span class="skip">- 行' + (i+1) + ' [' + svc + '] 変更不要（列13=' + v13 + '）</span>');
      }
    }
    return r;
  });

  const csvText = newRows.map(toCSVLine).join('\r\n');
  const uni = Encoding.stringToCode(csvText);
  const sjis = Encoding.convert(uni, { to: 'SJIS', from: 'UNICODE' });
  const blob = new Blob([new Uint8Array(sjis)], { type: 'text/csv' });

  res.style.display = 'block';
  res.innerHTML =
    '<div class="result-title">✅ 変換完了</div>' +
    '<div class="stat"><span class="lbl">総行数</span><span class="val">' + rows.length + '行</span></div>' +
    '<div class="stat"><span class="lbl">福祉用具行（171xxx）</span><span class="val">' + target + '行</span></div>' +
    '<div class="stat"><span class="lbl">単位数を修正した行</span><span class="val green">' + cnt1 + '行</span></div>' +
    '<div class="log">' + (logs.join('<br>') || '対象行なし') + '</div>' +
    '<button class="btn btn-green" id="dl">📥 ダウンロード（' + fname + '）</button>';

  document.getElementById('dl').addEventListener('click', () => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; a.click();
    URL.revokeObjectURL(url);
  });
});
</script>
</body>
</html>
